name: Reproducao completa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-e-consulta:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/senha-apenas-do-banco-descartavel
          NEO4J_server_memory_heap_initial__size: 128m
          NEO4J_server_memory_heap_max__size: 384m
          NEO4J_server_memory_pagecache_size: 64m
        ports:
          - 17474:7474
          - 17687:7687
    env:
      NEO4J_PASSWORD: senha-apenas-do-banco-descartavel
      NEO4J_HTTP_URL: http://127.0.0.1:17474
      LLM_URL: http://127.0.0.1:18081/v1/chat/completions
      LLM_ARTIFACT: Qwen2.5-1.5B-Instruct-GGUF@91cad51170dc346986eccefdc2dd33a9da36ead9:Q4_K_M
      TESTAR_NEO4J: '1'
      TESTAR_CORPUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-modelos.txt -r requirements-ui.txt
      - name: Adquirir e conferir fontes e modelos
        run: |
          python scripts/validar_fontes.py
          python scripts/verificar_corpus.py
          python scripts/baixar_modelos.py
      - name: Publicar corpus em banco vazio
        run: |
          python scripts/aguardar_banco.py --tempo 120
          python scripts/configurar_banco.py
          python scripts/ingerir.py
          python scripts/indexar.py
          python scripts/auditar_corpus.py --saida data/reports/auditoria-clone-linux.json
      - name: Testes com corpus e banco
        run: python -m unittest discover -s tests -v
      - name: Verificar transporte Bolt e rollback
        env:
          NEO4J_URI: bolt://127.0.0.1:17687
          NEO4J_ACCESS_MODE: WRITE
        run: |
          pip install neo4j==5.28.3
          python -m unittest discover -s tests -v
      - name: Preparar runtime fixado
        run: |
          python - <<'PY'
          import hashlib,json,tarfile,urllib.request
          from pathlib import Path
          catalogo=json.loads(Path('data/runtime-linux.json').read_text())
          data=urllib.request.urlopen(catalogo['url'],timeout=120).read()
          assert hashlib.sha256(data).hexdigest()==catalogo['sha256']
          pasta=Path('data/models/llama-linux');pasta.mkdir(parents=True,exist_ok=True)
          tar=pasta/'runtime.tar.gz';tar.write_bytes(data)
          with tarfile.open(tar) as pacote:
              membro=pacote.getmember('llama-server');assert membro.isfile()
              servidor=pasta/'llama-server';servidor.write_bytes(pacote.extractfile(membro).read());servidor.chmod(0o700)
          PY
      - name: Auditoria da nova extração
        run: python scripts/auditar_extracao.py --saida data/reports/auditoria-extracao-v2.json
      - name: Comparar modelos em contextos idênticos
        run: python scripts/comparar_modelos.py --saida data/reports/comparacao-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avaliacao-v2
          path: |
            data/reports/auditoria-clone-linux.json
            data/reports/auditoria-extracao-v2.json
            data/reports/comparacao-v2/
          retention-days: 30
